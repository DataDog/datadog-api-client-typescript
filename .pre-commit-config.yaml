repos:
  - repo: local
    hooks:
      - id: lint
        name: Lint
        language: node
        entry: yarn run lint:fix
        pass_filenames: false
        language_version: "21.7.3"
        # pre-commit 4.6.1+ requires a `language: node` local hook to install
        # something; pin yarn to match `packageManager` so node is still provisioned.
        additional_dependencies:
          - "yarn@1.22.22"
      - id: lint-examples
        name: Lint examples
        language: node
        entry: yarn run lint:fix-examples
        pass_filenames: false
        language_version: "21.7.3"
        additional_dependencies:
          - "yarn@1.22.22"
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
