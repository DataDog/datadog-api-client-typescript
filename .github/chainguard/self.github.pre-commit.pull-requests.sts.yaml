---
# Policy for the isolated pre-commit fix publisher. This must stay pinned to the
# immutable workflow revision used by reusable-pre-commit.yml.
issuer: https://token.actions.githubusercontent.com
subject: repo:DataDog/datadog-api-client-typescript:pull_request

claim_pattern:
  event_name: ^pull_request$
  job_workflow_ref: ^DataDog/datadog-api-client-typescript/\.github/workflows/reusable-pre-commit-fixes\.yml@7bdb3651e1b556f8ea2c6424ee7152fe3853332b$
  ref: ^refs/pull/[0-9]+/merge$
  repository: ^DataDog/datadog-api-client-typescript$

permissions:
  contents: write
