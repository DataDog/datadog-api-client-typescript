name: Reusable Pre-commit Workflow

on:
  workflow_call:
    inputs:
      target-branch:
        description: "Branch to checkout and test (defaults to the calling branch)"
        required: false
        type: string
        default: ""
      enable-commit-changes:
        description: "Whether to commit and push pre-commit fixes"
        required: false
        type: boolean
        default: true

env:
  GIT_AUTHOR_EMAIL: "packages@datadoghq.com"
  GIT_AUTHOR_NAME: "ci.datadog-api-spec"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    outputs:
      fixes-artifact-id: ${{ steps.upload_fixes.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          repository: DataDog/datadog-api-client-typescript
          ref: ${{ inputs.target-branch || github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Test CI security boundaries
        if: hashFiles('tests/ci/test_pre_commit_workflow.py') != ''
        run: python -m unittest discover -s tests/ci -v
      - name: set PY
        run: echo "PY=$(python -c 'import hashlib, sys, platform;print(hashlib.sha256(platform.python_version().encode()+sys.executable.encode()).hexdigest())')" >> $GITHUB_ENV
      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Determine pre-commit range
        id: commit_range
        run: |
          FROM_REF=$(git merge-base HEAD origin/master)
          echo "from_ref=$FROM_REF" >> $GITHUB_OUTPUT
          echo "to_ref=HEAD" >> $GITHUB_OUTPUT
          echo "Pre-commit will check from $FROM_REF to HEAD"
      - id: pre_commit
        name: Run pre-commit
        if: github.event.action != 'closed' && github.event.pull_request.merged != true
        run: |
          pre-commit run --from-ref "${FROM_REF}" --to-ref "${TO_REF}" --show-diff-on-failure --color=always
        env:
          FROM_REF: ${{ steps.commit_range.outputs.from_ref }}
          TO_REF: ${{ steps.commit_range.outputs.to_ref }}
      - name: Prepare fixes
        id: fixes
        if: >-
          failure() && steps.pre_commit.outcome == 'failure' &&
          inputs.enable-commit-changes && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |-
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git -c core.hooksPath=/dev/null commit -m "pre-commit fixes"
          mkdir -p "$RUNNER_TEMP/pre-commit-fixes"
          git bundle create "$RUNNER_TEMP/pre-commit-fixes/fixes.bundle" HEAD "^$HEAD_SHA"
          echo "created=true" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Upload fixes
        id: upload_fixes
        if: failure() && steps.fixes.outputs.created == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pre-commit-fixes-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pre-commit-fixes/fixes.bundle
          retention-days: 1
          if-no-files-found: error
      - id: pre_commit_schedule
        name: Run pre-commit in schedule
        if: github.event_name == 'schedule'
        run: |
          pre-commit run --all-files --show-diff-on-failure --color=always

  push-fixes:
    needs: pre-commit
    if: always() && needs.pre-commit.outputs.fixes-artifact-id != ''
    permissions:
      contents: read
      id-token: write
    # Only this immutable workflow revision is authorized to push fixes.
    uses: DataDog/datadog-api-client-typescript/.github/workflows/reusable-pre-commit-fixes.yml@7bdb3651e1b556f8ea2c6424ee7152fe3853332b
    with:
      artifact-id: ${{ needs.pre-commit.outputs.fixes-artifact-id }}
